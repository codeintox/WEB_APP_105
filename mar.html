<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Weather App</title>
    <style>
        *{
    padding: 0;
    margin:0;
    /*font-family: *Jost*, sans-serif; */
    font-family: "Quicksand", sans-serif;
}

body{
    background: #f3f2ef;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    height: 100vh;
    width:100vw;
}

html,
body {
    font-size: 62.5%;
    height: 100%;
}
html{
    background: #eee;
}

.box {
    width: 20vw;
    height: 60vh;
    border-radius: 0.5rem;
    box-shadow: 0 0.2rem 3rem rgba(0, 0, 0, 0.2);
    background: #a5bbdd;
    position: relative;
    overflow: hidden;
    transform: translate3d(0, 0, 0);
    min-height: 35rem;
    min-width: 20rem;
}

.wave {
    opacity: 0.3;
    position: absolute;
    top: 120%;
    left: 50%;
    background: white;
    width: 50rem;
    height: 50rem;
    margin-left: -25rem;
    margin-top: -25rem;
    transform-origin: 50%;
    border-radius: 43%;
    animation: drift 3000ms infinite linear;
    z-index: 1;
}

.wave -three {
    animation: drift 5000ms infinite linear;
    z-index: 2 !important;
    opacity: 0.2;
}

.wave -two{
    animation: drift 7000ms infinite linear;
    z-index: 3 !important;
    opacity: 0.1;
}

.box::after {
    content: "";
    display: block;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 11;
    transform: translate3d(0, 0, 0);
}

@keyframes drift{
    from{
        transform: rotate(0deg);
    }
    from {
        transform: rotate(360deg);
    }
}

.info {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 45%;
    z-index: 4;
}

.location {
    margin-top: 1.5rem;
    text-align: center;
    font-weight: 800;
    font-size: 3rem;
    font-size: 400;
}

.fa-street-view{
    animation: rotates 3s linear infinite alternate;
}

@keyframes rotates {
    from {
        transform: translateX(-00.5rem);
    }
    to{
        transform: translateX(00.5rem);
    }
}

#date{
    text-align: center;
    margin-top: 0.5rem;
    color: #57606f;
    font-size: 1.2rem;
    font-weight: 300;
    text-transform: uppercase;
}

.temp{
    margin-top: 2.5rem;
    text-align: center;
    font-size: 3rem;
}

.temp_min_max {
    text-align: center;
    margin-top: 0.3 rem;
    font-weight: 300;
    font-size: 1.2rem;
    color: #57606f;
}

#weathercon {
    height: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3em;
}

#weathecon .fas {
    font-size: 6rem;
    animation: fas-anime 3s linear infinite alternate;
}

@keyframes fas-anime {
    from {
        transform: scale(0.8);
    }
    to {
        transform: scale(1.2);
    }
}

@media (max-width: 600px){
    .box{
        width: 90vw;
        height: 80vh;
    }

    .wave {
        top: 85%;
    }

    #weathercon {
        font-size: 5em;
    }

    .info{
        font-size: 1.5rem;
    }
}
@media(max-height: 500px){
    .box {
        height: 80vh;
    }

    .wave{
        top: 115%;
    }
}

body > span {
    width: 100vw;
    text-align: center;
    color: grey;
}
    </style>
</head>
<body>
    <div class="box">
        <div class="wave -one"></div>
        <div class="wave -two"></div>
        <div class="wave -three"></div>
        <div id="weathercon">
            <i class="fas fa-sun" style="color: #eccc68;"></i>
        </div>
        <div class="info">
            <h2 class="location"><i class="fas fa-street-view"></i>Durgapur, IN</h2>
            <p id="date">THU | FEB 17 | 20:49pm</p>
            <h1 class="temp">26&deg;</h1>
            <h3 class="temp_min_max">Min 26&deg; | Max 38&deg;</h3>
        </div>
</div>
<script>
    const curDate = document.getElementById("date");
    let weathercon = document.getElementById("weathercon");
    const tempStatus = "Clouds";

    const getCurrentDay = () => {
        var wday = new Array(7);
        wday[0] = "SUN";
        wday[1] = "MON";
        wday[2] = "TUE";
        wday[3] = "WED";
        wday[4] = "THU";
        wday[5] = "FRI";
        wday[6] = "SAT";
        let curTime = new Date();
        let day = wday[curTime.getDay()];
        return day;
    }

    const getCurrTime = () => {
        var months = [
            "JAN",
            "FEB",
            "MAR",
            "APR",
            "MAY",
            "JUN",
            "JUL",
            "AUG",
            "SEPT",
            "OCT",
            "NOV",
            "DEC"
        ];
        var now = new Date();
        var month = months[now.getMonth()];
        var day = now.getDate();
        console.log(month + "/" + day);
        var hours = now.getHours();
        var min = now.getMinutes();
        let periods = "AM";
        if(hours > 11){
            periods = "PM";
            if(hours > 12) hours -=12;
        }
        if(min <10 ){
            min = "0" + min;
        }
        return `${month} ${day} | ${hours}:${min}${periods}`;
    };
    curDate.innerHTML = getCurrentDay() + " | " + getCurrTime();

</script>
</body>
</html>
