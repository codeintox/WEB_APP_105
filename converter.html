<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 50px 100px;
        }
        h1{
            text-align: center;
            text-decoration:dotted;
        }
        #container{
            padding: 50px;
            text-align: center;
            background-color: blueviolet;
            
            
        }
        .input-div{
            display: inline-block;
        }
        .inp{
            padding: 5px 10px;
            border: 10px;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            width: 50px;
        }
        label{
            font-size: 22px;
            color: aqua;
        }
    </style>
</head>
<body>
    <h1>CONVERTER</h1>
    <div id="container">
        <div class="input-div">
            <label for="">Celcius</label>
            <input type="number" value="0" id="cel" class="inp">
        </div>
        <div class="input-div"></div>
        <label for="">Fahrenheit</label>
        <input type="number" value="32" id="fah" class="inp">
    </div>
</body>
<script>
    var cel = document.getElementById('cel');
    var fah = document.getElementById('fah');
    cel.addEventListener('input',function(){
        let c = this.value;
        let f = c*9/5 +32;
        fah.value = f;
    })
    fah.addEventListener('input',function(){
        let f = this.value;
        let c = (f-32)/9 * 5;
        cel.value = c;
    })

</script>
</html>
